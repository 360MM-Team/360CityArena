[project]
name = "cityarena"
version = "0.1.0"
description = "360CityArena benchmark runner for embodied MLLM agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.76.0",
    "google-genai",
    "openai>=2.15.0",
    "pillow>=12.1.0",
    "requests>=2.32.5",
]

[project.scripts]
cityarena = "cityarena.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityarena"]
